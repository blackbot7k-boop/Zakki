<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Zakki 实心图标选中态 · 效果确认</title>
<style>
  :root {
    --bg: #f5f5f2; --card: #ffffff; --text: #2a2c2e; --muted: #6b6e72; --line: #dededa;
    --header-bg: rgba(246,246,244,0.98); --status-bg: rgba(240,240,238,0.98);
    --accent: #3b6ea5; --accent-ink: #ffffff;
  }
  .dark {
    --bg: #1e1f21; --card: #262729; --text: #e8e8e6; --muted: #9a9da1; --line: #3a3c3f;
    --header-bg: rgba(38,39,41,0.98); --status-bg: rgba(33,34,36,0.98);
    --accent: #7fb0e0; --accent-ink: #10233a;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--text); font: 14px/1.6 -apple-system, "PingFang SC", "Segoe UI", sans-serif; padding: 28px 32px 60px; transition: background .2s, color .2s; }
  h1 { font-size: 22px; margin-bottom: 6px; }
  .sub { color: var(--muted); margin-bottom: 18px; }
  .toggle { position: fixed; top: 20px; right: 28px; display: flex; gap: 8px; z-index: 5; }
  .toggle button { padding: 6px 16px; border-radius: 999px; border: 1px solid var(--line); background: var(--card); color: var(--text); cursor: pointer; font-size: 13px; }
  .toggle button.on { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
  .grid { display: grid; grid-template-columns: repeat(2, minmax(380px, 1fr)); gap: 18px; max-width: 1100px; }
  @media (max-width: 900px) { .grid { grid-template-columns: 1fr; } }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 18px 20px 20px; }
  .card h2 { font-size: 15px; margin-bottom: 2px; }
  .card .desc { color: var(--muted); font-size: 12.5px; margin-bottom: 14px; min-height: 34px; }
  .fake { border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
  .bar { display: flex; align-items: center; height: 38px; background: var(--header-bg); padding: 0 12px; border-bottom: 1px solid var(--line); }
  .bar .grow { flex: 1; }
  .status { display: flex; align-items: center; gap: 8px; height: 36px; background: var(--status-bg); padding: 0 12px; font-size: 12px; color: var(--accent); }
  .status .grow { flex: 1; }
  .icon { width: 24px; height: 24px; border-radius: 6px; display: inline-flex; align-items: center; justify-content: center; cursor: pointer; flex: none; margin-left: 6px; color: var(--muted); position: relative; }
  .icon svg { width: 16px; height: 16px; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  .icon:hover { background: color-mix(in srgb, currentColor 14%, transparent); }
  /* C 实心图标：激活换 fill 版本 */
  .st-c.on { color: var(--accent); }
  .st-c svg.v-fill { display: none; fill: currentColor; stroke: none; }
  .st-c.on svg.v-fill { display: block; }
  .st-c.on svg.v-line { display: none; }
  .row-label { display: flex; align-items: center; gap: 10px; margin: 14px 0 8px; font-size: 12px; color: var(--muted); }
  .row-label::after { content: ""; flex: 1; height: 1px; background: var(--line); }
</style>
</head>
<body>
<div class="toggle">
  <button id="t-light" class="on">浅色</button>
  <button id="t-dark">深色</button>
</div>
<h1>实心图标选中态 · 效果确认</h1>
<div class="sub">线性 = 未选中，实心 + 强调色 = 选中。点图标可切换；右上角切明暗。图钉与眼睛的实心版都带瞳孔/底座细节，与线性版同一轮廓。</div>

<div class="grid" id="grid"></div>

<script>
// 实心版与线性版同一 24×24 网格与轮廓。
const PIN_LINE = '<svg class="v-line" viewBox="0 0 24 24"><path d="M12 17v5"/><path d="M9 10.76a2 2 0 0 1-1.11 1.79l-1.78.9A2 2 0 0 0 5 15.24V16a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1v-.76a2 2 0 0 0-1.11-1.79l-1.78-.9A2 2 0 0 1 15 10.76V6h1a2 2 0 0 0 0-4H8a2 2 0 0 0 0 4h1z"/></svg>';
const PIN_FILL = '<svg class="v-fill" viewBox="0 0 24 24"><path d="M9 10.76a2 2 0 0 1-1.11 1.79l-1.78.9A2 2 0 0 0 5 15.24V16a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1v-.76a2 2 0 0 0-1.11-1.79l-1.78-.9A2 2 0 0 1 15 10.76V6h1a2 2 0 0 0 0-4H8a2 2 0 0 0 0 4h1z"/><path d="M10.75 16.5h2.5V21a1.25 1.25 0 0 1-2.5 0z"/></svg>';
const EYE_LINE = '<svg class="v-line" viewBox="0 0 24 24"><path d="M2.06 12.35a1 1 0 0 1 0-.7 10.75 10.75 0 0 1 19.88 0 1 1 0 0 1 0 .7 10.75 10.75 0 0 1-19.88 0"/><circle cx="12" cy="12" r="3"/></svg>';
const EYE_FILL = '<svg class="v-fill" viewBox="0 0 24 24"><path fill-rule="evenodd" d="M2.06 12.35a1 1 0 0 1 0-.7 10.75 10.75 0 0 1 19.88 0 1 1 0 0 1 0 .7 10.75 10.75 0 0 1-19.88 0zM12 15a3 3 0 1 0 0-6 3 3 0 0 0 0 6z"/></svg>';
const SEARCH = '<svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>';
const CLOSE = '<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="m15 9-6 6"/><path d="m9 9 6 6"/></svg>';

function iconBtn(cls, on, inner, label) {
  return `<span class="icon ${cls} ${on ? "on" : ""}" title="${label}">${inner}</span>`;
}

document.getElementById("grid").innerHTML = `
  <div class="card">
    <h2>顶栏 · 置顶</h2>
    <div class="desc">左：未选中（线性灰）。右：已置顶（实心强调色）。点击切换对比。</div>
    <div class="fake">
      <div class="bar">
        ${iconBtn("", false, CLOSE, "关闭窗口")}
        <span class="grow"></span>
        ${iconBtn("st-c", false, PIN_LINE + PIN_FILL, "置顶")}
        ${iconBtn("st-c", true, PIN_LINE + PIN_FILL, "置顶（开）")}
      </div>
      <div style="height:110px"></div>
    </div>
  </div>
  <div class="card">
    <h2>底栏 · 源码预览切换</h2>
    <div class="desc">眼睛实心 = 当前处于源码模式；线性 = 实时预览。搜索保持线性不变。</div>
    <div class="fake">
      <div class="status" style="margin-top:110px">
        <span>0 行 · 0 词 · 0 字符</span><span class="grow"></span>
        <span>已保存 15:04</span>
        ${iconBtn("st-c", false, EYE_LINE + EYE_FILL, "源码模式")}
        ${iconBtn("st-c", true, EYE_LINE + EYE_FILL, "源码模式（开）")}
        ${iconBtn("", false, SEARCH, "搜索")}
      </div>
    </div>
  </div>
  <div class="card">
    <h2>明暗主题下的对比</h2>
    <div class="desc">实心强调色在两种主题下都应清晰；切右上角明暗后回来看这组。</div>
    <div class="fake">
      <div class="bar" style="background:#262729">
        <span style="color:#9a9da1">${iconBtn("st-c", false, PIN_LINE + PIN_FILL, "置顶")}${iconBtn("st-c", true, PIN_LINE + PIN_FILL, "置顶（开）")}</span>
      </div>
      <div class="status" style="background:#212224;color:#7fb0e0">
        <span>深色状态栏</span><span class="grow"></span>
        ${iconBtn("st-c", false, EYE_LINE + EYE_FILL, "源码模式")}
        ${iconBtn("st-c", true, EYE_LINE + EYE_FILL, "源码模式（开）")}
      </div>
      <div style="height:56px"></div>
    </div>
  </div>
  <div class="card">
    <h2>尺寸与对齐</h2>
    <div class="desc">实心版与线性版同占 16pt 视觉框；24pt 点击区、6px 圆角不变。</div>
    <div class="fake">
      <div class="bar">
        ${iconBtn("st-c", false, PIN_LINE + PIN_FILL, "线性")}
        ${iconBtn("st-c", true, PIN_LINE + PIN_FILL, "实心")}
        <span class="grow"></span>
        <span style="color:var(--muted);font-size:12px">16pt 图形 · 24pt 点击区</span>
      </div>
      <div class="status">
        ${iconBtn("st-c", false, EYE_LINE + EYE_FILL, "线性")}
        ${iconBtn("st-c", true, EYE_LINE + EYE_FILL, "实心")}
        <span class="grow"></span>
        <span style="color:var(--muted)">1px 网格对齐</span>
      </div>
      <div style="height:40px"></div>
    </div>
  </div>
`;

document.querySelectorAll(".icon").forEach(el => {
  el.addEventListener("click", () => { el.classList.toggle("on"); });
});
const tl = document.getElementById("t-light"), td = document.getElementById("t-dark");
tl.onclick = () => { document.body.classList.remove("dark"); tl.classList.add("on"); td.classList.remove("on"); };
td.onclick = () => { document.body.classList.add("dark"); td.classList.add("on"); tl.classList.remove("on"); };
</script>
</body>
</html>
