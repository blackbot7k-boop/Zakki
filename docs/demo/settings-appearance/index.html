<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>设置页 · 外观（三卡版）· 实现预览</title>
<style>
  /* 原型页：对应 internal/app/settings_*.go 当前实现，非生产代码。 */
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, "PingFang SC", "Helvetica Neue", sans-serif;
    background: #f5f5f7; color: #1d1d1f; padding: 26px 20px 46px;
    -webkit-font-smoothing: antialiased; font-size: 13px;
  }
  header.page { max-width: 1000px; margin: 0 auto 14px; display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; }
  header.page h1 { font-size: 19px; }
  header.page .sub { color: #6e6e73; font-size: 12.5px; }
  header.page .spacer { flex: 1; }
  .pagebar button {
    font: 12px -apple-system, "PingFang SC", sans-serif; padding: 5px 12px; border-radius: 7px;
    border: 1px solid #6e6e73; background: transparent; color: #1d1d1f; cursor: pointer;
  }

  /* ---- 设置窗口（随颜色主题实时变色） ---- */
  .win {
    --bg: #ffffff; --header: #f2f2f4; --surface: #f2f2f4; --border: #e0e0e3;
    --text: #1d1d1f; --muted: #6e6e73; --accent: #3a3a3c; --sel: rgba(58,58,60,.22);
    --code-bg: #f2f2f4; --hover: rgba(0,0,0,.045);
    max-width: 1000px; margin: 0 auto; height: 780px; border-radius: 10px; overflow: hidden;
    background: var(--bg); color: var(--text);
    box-shadow: 0 18px 44px rgba(0,0,0,.18), 0 0 0 1px rgba(0,0,0,.08);
    display: flex; flex-direction: row;
  }
  .win.dark { box-shadow: 0 18px 44px rgba(0,0,0,.5), 0 0 0 1px rgba(255,255,255,.06); }
  .sidebar {
    width: 200px; flex: 0 0 200px; background: var(--header);
    padding: 14px 10px; display: flex; flex-direction: column; gap: 2px;
    border-right: 1px solid var(--border);
  }
  .sidebar .app { display: flex; gap: 8px; align-items: center; padding: 6px 10px 12px; font-weight: 600; }
  .sidebar .app i { width: 18px; height: 18px; border-radius: 5px; background: var(--accent); display: block; }
  .sbitem {
    padding: 7px 10px; border-radius: 7px; cursor: pointer; color: var(--muted);
    display: flex; gap: 8px; align-items: center;
  }
  .sbitem:hover { background: var(--hover); }
  .sbitem.on { background: var(--sel); color: var(--text); }
  .sbitem i { width: 14px; height: 14px; border-radius: 4px; background: currentColor; opacity: .55; display: block; }
  .content { flex: 1; overflow: auto; padding: 28px 24px; }

  /* ---- 卡片与行（对齐 settingsCard / settingsRow 的新排版参数） ---- */
  .cards { display: flex; flex-direction: column; gap: 16px; }
  .card { border: 1px solid var(--border); border-radius: 10px; background: var(--surface); overflow: hidden; }
  .card > .ctitle { font-size: 12px; font-weight: 700; color: var(--muted); padding: 14px 16px 2px; }
  .divider { height: 1px; background: var(--border); }
  .row { display: flex; align-items: center; gap: 12px; padding: 10px 16px; }
  .row .lab { flex: 1; }
  .row .hint { font-size: 11px; color: var(--muted); margin-top: 2px; }
  .note { font-size: 11px; color: var(--muted); padding: 0 16px 2px; }
  select, input[type=number], input[type=text] {
    font: 13px -apple-system, "PingFang SC", sans-serif; padding: 5px 9px; border-radius: 7px;
    border: 1px solid var(--border); background: var(--bg); color: var(--text);
  }
  input[type=number] { width: 76px; }
  .switch { width: 34px; height: 20px; border-radius: 999px; background: var(--sel); position: relative; cursor: pointer; }
  .switch i { position: absolute; top: 2px; left: 2px; width: 16px; height: 16px; border-radius: 999px; background: #fff; box-shadow: 0 1px 2px rgba(0,0,0,.25); transition: left .15s; }
  .switch.on { background: var(--accent); }
  .switch.on i { left: 16px; }

  /* 恢复本页默认值：弱化小按钮 */
  .resetrow { display: flex; align-items: center; padding: 8px 16px; }
  .resetrow .spacer { flex: 1; }
  .resetbtn {
    font-size: 12px; color: var(--muted); padding: 4px 10px; border-radius: 7px;
    cursor: pointer; border: none; background: transparent; font-family: inherit;
  }
  .resetbtn:hover { background: var(--hover); }

  .placeholder { color: var(--muted); font-size: 12.5px; padding: 18px 16px; }
  .toast {
    position: fixed; left: 50%; bottom: 26px; transform: translateX(-50%);
    background: #1d1d1f; color: #f5f5f7; font-size: 13px; padding: 9px 16px;
    border-radius: 9px; opacity: 0; transition: opacity .25s; pointer-events: none; z-index: 9;
  }
</style>
</head>
<body>
<header class="page">
  <h1>设置 · 外观（三卡版）</h1>
  <span class="sub">internal/app/settings_*.go 当前实现的可交互预览 · 主题卡与配色均实时生效</span>
  <span class="spacer"></span>
  <span class="pagebar"><button id="darkToggle">窗口深色</button></span>
</header>

<div class="win" id="win">
  <div class="sidebar" id="sidebar"></div>
  <div class="content" id="content"></div>
</div>
<div class="toast" id="toast"></div>

<script>
"use strict";
// ---- 8 套颜色主题（取自 view_theme.go / view_codehl.go 的真实调色板） ----
const THEMES = {
  classic:  { name: "经典", light: P("#ffffff","#f2f2f4","#f2f2f4","#e0e0e3","#1d1d1f","#6e6e73","#3a3a3c","rgba(58,58,60,.22)"), dark: P("#1e1e20","#2a2a2c","#2c2c2e","#3d3d40","#f2f2f4","#a8a8ad","#d1d1d6","rgba(209,209,214,.30)") },
  paper:    { name: "纸白", light: P("#fafaf8","#f0f0ec","#ffffff","#dededa","#2a2c2e","#6b6e72","#3b6ea5","rgba(59,110,165,.28)"), dark: P("#202224","#282a2d","#2b2e31","#3d4045","#e8e9ea","#a3a6a9","#7fb3e3","rgba(127,179,227,.32)") },
  warmSand: { name: "暖砂", light: P("#f5efe3","#eee6d5","#fdfaf3","#ddd2bc","#43331f","#77664e","#96551f","rgba(150,85,31,.26)"), dark: P("#29251f","#312c25","#342f28","#4a443a","#efe7da","#b3a893","#e2ab67","rgba(226,171,103,.30)") },
  mistTeal: { name: "雾青", light: P("#edf4f1","#e2ece8","#f8fbfa","#cfdfd8","#1e3a33","#55716a","#24685a","rgba(36,104,90,.24)"), dark: P("#1d2927","#233130","#263533","#394946","#e4eeea","#9db4ae","#7cc7b2","rgba(124,199,178,.30)") },
  graphite: { name: "石墨", light: P("#eff1f5","#e5e8ee","#f9fafc","#d5dae3","#2b3440","#636d7d","#40639c","rgba(64,99,156,.26)"), dark: P("#20242d","#272c37","#2b3140","#3e4553","#e5e9f0","#a0aab8","#84a9e8","rgba(132,169,232,.30)") },
  sketch:   { name: "手绘", light: P("#fbf6ea","#f3ead6","#fffcf3","#d8c9a8","#2d2a26","#6b6252","#b23a1e","rgba(255,212,64,.45)"), dark: P("#262420","#2f2c26","#322e27","#4b4538","#efe7d6","#b7ac95","#f2a66e","rgba(240,200,90,.30)") },
  claude:   { name: "Claude", light: P("#faf9f5","#f0eee6","#ffffff","#e3dfd3","#141413","#6b675f","#c96442","rgba(217,119,87,.22)"), dark: P("#1f1e1d","#191918","#262523","#2e2c2a","#e8e6dc","#a39e93","#d97757","rgba(217,119,87,.28)") },
  qoder:    { name: "Qoder", light: P("#ffffff","#f2f4f2","#ffffff","#e3e6e3","#141414","#636261","#4b6f5a","rgba(75,111,90,.22)"), dark: P("#191b1a","#242624","#222523","#363c37","#d9dcd9","#949d96","#8ee5a1","rgba(77,156,97,.32)") },
};
function P(bg, header, surface, border, text, muted, accent, sel) {
  return { bg, header, surface, border, text, muted, accent, sel,
           codeBg: surface, quote: muted, rule: border };
}
// 代码配色（取自 view_codehl.go）：[注释, 字符串, 数字, 关键字]
const CODE = {
  none:   null,
  soft:   { light: { c:"#9aa4ad", s:"#5f9e6e", n:"#b08a5a", k:"#7d92c4" }, dark: { c:"#7d8791", s:"#93c0a0", n:"#cfae85", k:"#9db1d8" } },
  vivid:  { light: { c:"#a0a1a7", s:"#50a14f", n:"#986801", k:"#4078f2" }, dark: { c:"#7f848e", s:"#98c379", n:"#d19a66", k:"#c678dd" } },
  claude: { light: { c:"#938d82", s:"#5e8a3a", n:"#a85a1f", k:"#b8573a" }, dark: { c:"#7d786f", s:"#b3c98a", n:"#d4a27f", k:"#d97757" } },
  qoder:  { light: { c:"#848c86", s:"#8a5a00", n:"#b85a1f", k:"#2f7550" }, dark: { c:"#758077", s:"#d8c07a", n:"#efb080", k:"#73cd94" } },
};
// 排版主题（取自 view_theme.go markdownLayouts）
const LAYOUTS = {
  sonnet:  { name: "Sonnet（Typora）", note: "Typora 式排版", size: 16, lh: 1.6, font: "-apple-system,'PingFang SC',sans-serif" },
  note:    { name: "便签", note: "便签排版", size: 15, lh: 1.5, font: "Georgia,'Songti SC',serif" },
  clear:   { name: "清晰", note: "层级明确", size: 16, lh: 1.65, font: "-apple-system,'PingFang SC',sans-serif" },
  book:    { name: "书页", note: "衬线意象", size: 17, lh: 1.8, font: "Georgia,'Songti SC',serif" },
  compact: { name: "紧凑", note: "收紧间距", size: 15, lh: 1.5, font: "-apple-system,'PingFang SC',sans-serif" },
  sketch:  { name: "手账", note: "手账留白", size: 16, lh: 1.75, font: "'Kaiti SC','STKaiti',cursive" },
};

// ---- 草稿状态 ----
const st = {
  page: "appearance", dark: false, winDark: false,
  appearanceMode: "system", theme: "claude", layout: "sonnet", code: "soft",
  bodyFont: "霞鹜文楷（默认）", latinFont: "跟随中文字体", monoFont: "JetBrains Mono（默认）",
  sizeOverride: null, lhOverride: null, sketchApplied: false,
};
const $ = (id) => document.getElementById(id);
const el = (tag, attrs = {}, ...kids) => {
  const n = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (k === "class") n.className = v;
    else if (k.startsWith("on")) n.addEventListener(k.slice(2), v);
    else n.setAttribute(k, v);
  }
  for (const kid of kids) n.append(kid);
  return n;
};
let toastTimer;
function toast(msg) {
  const n = $("toast"); n.textContent = msg; n.style.opacity = 1;
  clearTimeout(toastTimer); toastTimer = setTimeout(() => (n.style.opacity = 0), 1600);
}
function pal() {
  const t = THEMES[st.theme];
  const dark = st.appearanceMode === "dark" || (st.appearanceMode === "system" && st.winDark);
  return dark ? t.dark : t.light;
}
function dark() {
  return st.appearanceMode === "dark" || (st.appearanceMode === "system" && st.winDark);
}

// ---- 侧栏 ----
const PAGES = [
  ["general", "常规"], ["appearance", "外观"], ["tabs", "标签与外观"],
  ["backup", "备份与数据"], ["keymap", "快捷键"],
];
function renderSidebar() {
  const sb = $("sidebar"); sb.innerHTML = "";
  sb.append(el("div", { class: "app" }, el("i"), "Zakki"));
  for (const [id, name] of PAGES) {
    sb.append(el("div", { class: "sbitem" + (st.page === id ? " on" : ""), onclick: () => { st.page = id; render(); } },
      el("i"), name));
  }
}

// ---- 卡片原语 ----
function card(title, ...body) {
  return el("div", { class: "card" },
    el("div", { class: "ctitle" }, title),
    ...body);
}
function divider() { return el("div", { class: "divider" }); }
function selectRow(label, options, current, onchange) {
  const sel = el("select");
  for (const o of options) sel.append(el("option", { ...(o === current ? { selected: "" } : {}) }, o));
  sel.addEventListener("change", () => onchange(sel.value));
  return el("div", { class: "row" }, el("div", { class: "lab" }, label), sel);
}
function switchRow(label, hint, on, onchange) {
  const sw = el("div", { class: "switch" + (on ? " on" : "") }, el("i"));
  sw.addEventListener("click", () => onchange(!on));
  const col = el("div", { class: "lab" }, el("div", {}, label), hint ? el("div", { class: "hint" }, hint) : "");
  return el("div", { class: "row" }, col, sw);
}
function resetFooter(key) {
  const b = el("button", { class: "resetbtn", onclick: () => toast("已恢复本页默认值（演示）") }, "恢复本页默认值");
  return el("div", { class: "resetrow" }, el("div", { class: "spacer" }), b);
}

// ---- 各页面 ----
function pageAppearance(box) {
  // 卡 1：主题
  const themeBody = selectRow("颜色主题",
    Object.values(THEMES).map(t => t.name),
    THEMES[st.theme].name,
    v => { st.theme = Object.keys(THEMES).find(id => THEMES[id].name === v); render(); });

  // 卡 1 的手绘预设行
  const applied = st.sketchApplied && st.theme === "sketch" && st.layout === "sketch" && st.bodyFont === "手写";
  const presetBtn = el("button", { class: "btn" }, applied ? "已套用" : "一键套用");
  presetBtn.addEventListener("click", () => {
    if (applied) return;
    st.theme = "sketch"; st.layout = "sketch"; st.bodyFont = "手写"; st.sketchApplied = true;
    render(); toast("已套用手绘手账（演示）");
  });
  const presetRow = el("div", { class: "row" },
    el("div", { class: "lab" },
      el("div", {}, "手绘手账"),
      el("div", { class: "hint" }, "点阵纸、手写字体、铅笔线框、荧光笔标题与马克笔引用")),
    presetBtn);

  const modeLabel = { system: "跟随系统", light: "浅色", dark: "深色" }[st.appearanceMode];
  box.append(card("主题",
    selectRow("界面外观", ["跟随系统", "浅色", "深色"], modeLabel, v => { st.appearanceMode = v === "跟随系统" ? "system" : (v === "浅色" ? "light" : "dark"); render(); }),
    divider(),
    themeBody,
    divider(),
    presetRow));

  // 卡 2：排版
  const L = LAYOUTS[st.layout];
  const bodySize = st.sizeOverride ?? L.size, lineHeight = st.lhOverride ?? L.lh;
  const note = `${L.name}：${L.note}，${bodySize} / ${lineHeight} 行高`;
  const typo = el("div", { style: "display:flex;flex-direction:column" },
    selectRow("排版主题", Object.values(LAYOUTS).map(L => L.name), L.name,
      v => { st.layout = Object.keys(LAYOUTS).find(id => LAYOUTS[id].name === v); render(); }),
    el("div", { class: "note" }, note));
  const typoCard = card("排版", typo, divider(),
    selectRow("中文字体", ["霞鹜文楷（默认）", "系统苹方", "宋体", "手写"], st.bodyFont, v => { st.bodyFont = v; render(); }),
    divider(),
    selectRow("西文字体", ["跟随中文字体", "JetBrains Mono", "系统西文", "Noteworthy", "Bradley Hand"], st.latinFont, v => { st.latinFont = v; }),
    divider(),
    selectRow("代码字体", ["JetBrains Mono（默认）", "SF Mono", "Menlo"], st.monoFont, v => { st.monoFont = v; }),
    divider(),
    numRow("字号", "10–40；清空表示跟随排版主题", L.size, st.sizeOverride, v => { st.sizeOverride = v; render(); }),
    divider(),
    numRow("行高", "1–3；清空表示跟随排版主题", L.lh, st.lhOverride, v => { st.lhOverride = v; render(); }),
    divider(),
    resetFooter("typography"));
  box.append(typoCard);

  // 卡 3：代码配色
  box.append(card("代码配色",
    selectRow("语法配色", ["跟随文本", "柔和", "明快", "Claude", "Qoder"],
      st.code === "none" ? "跟随文本" : { soft: "柔和", vivid: "明快", claude: "Claude", qoder: "Qoder" }[st.code],
      v => { st.code = { "跟随文本": "none", "柔和": "soft", "明快": "vivid", "Claude": "claude", "Qoder": "qoder" }[v]; render(); }),
    divider(),
    resetFooter("code")));
}

function numRow(label, hint, placeholder, override, onchange) {
  const input = el("input", { type: "number", ...(override != null ? { value: String(override) } : { placeholder: String(placeholder) }) });
  input.addEventListener("change", () => {
    const v = parseFloat(input.value);
    onchange(isNaN(v) ? null : v);
  });
  return el("div", { class: "row" },
    el("div", { class: "lab" }, el("div", {}, label), el("div", { class: "hint" }, hint)), input);
}
function codeHTML(line) {
  const scheme = CODE[st.code];
  if (!scheme) return escapeHTML(line);
  const c = dark() ? scheme.dark : scheme.light;
  return `<span style="color:${c.k}">const</span> a = <span style="color:${c.n}">1</span>;`;
}
function escapeHTML(s) { return s.replace(/&/g, "&amp;").replace(/</g, "&lt;"); }

// ---- 其他页（占位，保持演示聚焦外观页） ----
function pageGeneral(box) {
  box.append(card("语言", selectRow("界面语言", ["简体中文", "English"], "简体中文", () => {})));
  box.append(card("窗口",
    switchRow("记忆主窗口位置与尺寸", "", true, () => {}),
    divider(),
    switchRow("关闭窗口后隐藏到托盘", "", true, () => {})));
}
function pageTabs(box) {
  box.append(card("标签与外观", el("div", { class: "placeholder" }, "标签列表、顶栏动效、圆点形状与调色板（本演示聚焦外观页）。")));
}
function pageBackup(box) {
  box.append(card("备份与数据", el("div", { class: "placeholder" }, "外部镜像、Git 自动化、自动备份间隔与保留份数（本演示聚焦外观页）。")));
}
function pageKeymap(box) {
  box.append(card("快捷键", el("div", { class: "placeholder" }, "命令改键与固定键列表（本演示聚焦外观页）。")));
}

const RENDERERS = { general: pageGeneral, appearance: pageAppearance, tabs: pageTabs, backup: pageBackup, keymap: pageKeymap };

// ---- 外壳渲染 ----
function applyThemeVars() {
  const p = pal();
  const win = $("win");
  for (const [k, v] of Object.entries({
    "--bg": p.bg, "--header": p.header, "--surface": p.surface, "--border": p.border,
    "--text": p.text, "--muted": p.muted, "--accent": p.accent, "--sel": p.sel,
    "--code-bg": p.codeBg, "--hover": dark() ? "rgba(255,255,255,.05)" : "rgba(0,0,0,.045)",
  })) win.style.setProperty(k, v);
}
function render() {
  applyThemeVars();
  renderSidebar();
  const box = $("content"); box.innerHTML = "";
  RENDERERS[st.page](box);
  $("darkToggle").textContent = $("win").classList.contains("dark") ? "窗口浅色" : "窗口深色";
}

$("darkToggle").addEventListener("click", () => { st.winDark = !st.winDark; $("win").classList.toggle("dark"); render(); });
render();
</script>
</body>
</html>
