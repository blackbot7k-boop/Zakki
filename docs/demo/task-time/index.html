<!DOCTYPE html>
<!--
  PROTOTYPE（用完即弃）：Zakki 待办时间功能外观确认

  问题：待办的截止时间/提醒在 预览（标准/手账）与源码 三个视图里长什么样？
  方案：单文件 HTML，一份任务状态驱动三个视图同步渲染（演示"文本即数据"）；
        chip 有 3 个外观变体，用底部切换条或 ←/→ 切换，也可用 ?variant=A|B|C。
  语法约定：截止 `@YYYY-MM-DD HH:mm`，提醒 `~10m / ~1h / ~1d / ~0m`（相对提前量；@ = 在某时刻，~ = 约提前多久）。
  直接双击打开即可，无任何依赖。
-->
<html lang="zh-Hans">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Zakki 待办时间 · 原型</title>
<style>
  :root {
    /* 经典浅色（取自 view_theme.go） */
    --bg: #ffffff; --ink: #26251f; --sec: #85827a; --rule: #eceae5;
    --accent: #3b6ea5; --accent-tint: rgba(59, 110, 165, .11);
    --danger: #c4402f; --danger-tint: rgba(196, 64, 47, .10);
    --amber: #9a6b00;
    /* 手账（取自 view_sketch.go / 主题） */
    --paper: #f6efdf; --pencil: #8a8377; --red: #b23a1e; --hl: rgba(255, 212, 64, .55);
    --mono: "SF Mono", Menlo, Consolas, monospace;
  }
  * { box-sizing: border-box; margin: 0; }
  body {
    font-family: -apple-system, "PingFang SC", "Segoe UI", sans-serif;
    background: linear-gradient(160deg, #e9e6df, #dcd8ce);
    padding: 28px 20px 96px; color: var(--ink);
  }
  .proto-note { text-align: center; font-size: 12.5px; color: #6b675e; margin-bottom: 18px; }
  .proto-note b { color: var(--ink); }

  .desk { display: flex; gap: 22px; flex-wrap: wrap; justify-content: center; align-items: flex-start; }

  /* ── Zakki 窗口框 ─────────────────────────── */
  .win { background: var(--bg); border-radius: 11px; overflow: hidden; flex: 1 1 400px; max-width: 560px;
         box-shadow: 0 18px 50px rgba(60, 55, 40, .25), 0 2px 8px rgba(60, 55, 40, .12); }
  .topbar { height: 38px; display: flex; align-items: center; padding: 0 12px; gap: 10px;
            border-bottom: 1px solid var(--rule); background: #faf9f7; }
  .lights { display: flex; gap: 7px; }
  .lights i { width: 11px; height: 11px; border-radius: 50%; }
  .lights i:nth-child(1) { background: #ff5f57; } .lights i:nth-child(2) { background: #febc2e; } .lights i:nth-child(3) { background: #28c840; }
  .tabs { display: flex; gap: 8px; align-items: center; margin-left: 4px; }
  .tdot { width: 9px; height: 9px; border-radius: 50%; }
  .tdot.on { outline: 2px solid rgba(0,0,0,.12); outline-offset: 2px; }
  .tname { font-size: 12px; color: var(--sec); background: #efede8; border-radius: 20px; padding: 2px 10px; }
  .winlabel { margin-left: auto; font-size: 11px; color: #a09c92; letter-spacing: .4px; }

  .pane { padding: 18px 22px 22px 26px; min-height: 340px; font-size: 15px; line-height: 1.9; }
  .pane h3 { font-size: 17px; margin: 6px 0 4px; }
  .pane .bullet { color: var(--sec); }
  .pane .bullet::before { content: "• "; color: var(--accent); }

  /* ── 任务行与勾选框（标准）────────────────── */
  .task { display: flex; align-items: baseline; gap: 9px; padding: 1px 0; border-radius: 6px; transition: background .5s; }
  .task.flash { background: var(--accent-tint); }
  .cb { width: 15px; height: 15px; border: 1.5px solid #b9b5ac; border-radius: 4px; flex: none; cursor: pointer;
        position: relative; top: 2px; background: #fff; }
  .cb.on { background: var(--accent); border-color: var(--accent); }
  .cb.on::after { content: ""; position: absolute; left: 4px; top: 1px; width: 4px; height: 8px;
                  border: solid #fff; border-width: 0 1.8px 1.8px 0; transform: rotate(42deg); }
  .task .tx { flex: 0 1 auto; }
  .task.done .tx { opacity: .5; }

  /* ── 日期 chip：三个外观变体 ──────────────── */
  .chip { display: inline-flex; align-items: center; gap: 4px; font-size: 12.5px; cursor: pointer;
          white-space: nowrap; user-select: none; margin-left: -3px; vertical-align: 1px; border-radius: 5px; }
  .chip svg { width: 12px; height: 12px; flex: none; }
  .st-overdue { color: var(--danger); } .st-today { color: var(--accent); }
  .st-future { color: var(--sec); }    .st-done { color: #b6b2a9; }

  /* 变体 A：极简文字 */
  .v-a .chip:hover { text-decoration: underline; }
  /* 变体 B：图标 + 文字，悬停浅底 */
  .v-b .chip { padding: 1.5px 6px; }
  .v-b .chip:hover { background: rgba(0,0,0,.06); }
  .v-b .chip.st-overdue:hover { background: var(--danger-tint); }
  .v-b .chip.st-today:hover { background: var(--accent-tint); }
  /* 变体 C：胶囊浅底 */
  .v-c .chip { padding: 2px 9px; border-radius: 999px; }
  .v-c .chip.st-overdue { background: var(--danger-tint); }
  .v-c .chip.st-today { background: var(--accent-tint); }
  .v-c .chip.st-future { background: rgba(0,0,0,.055); }
  .v-c .chip.st-done { background: rgba(0,0,0,.045); }

  /* ── 手账窗格 ─────────────────────────────── */
  .win.paper { background: var(--paper); }
  .paper .pane {
    background-image: radial-gradient(#d8cfb8 1px, transparent 1.1px);
    background-size: 17px 17px; background-position: 4px 6px;
    font-family: "LXGW WenKai", "Kaiti SC", "STKaiti", serif; position: relative;
  }
  .paper .pane::before { content: ""; position: absolute; left: 20px; top: 0; bottom: 0; width: 1px; background: rgba(178, 58, 30, .35); }
  .paper h3 { color: var(--red); }
  .paper .cb { border: 2px solid var(--pencil); border-radius: 3px 5px 3px 6px; transform: rotate(-1.5deg); background: transparent; }
  .paper .cb.on { background: transparent; border-color: var(--red); }
  .paper .cb.on::after { border-color: var(--red); left: 3px; top: 0; }
  .bm { flex: none; width: 15px; text-align: center; color: var(--accent); }
  .paper .bm { color: var(--pencil); }
  .paper .chip { border: 1.5px dashed var(--pencil); padding: 0 6px; border-radius: 4px 6px 4px 7px; }
  .paper .chip.st-overdue { color: var(--red); border-color: rgba(178, 58, 30, .55); }
  .paper .chip.st-today { color: var(--red); background: var(--hl); border-color: transparent; }
  .paper .chip.st-future { color: #6d6558; }
  .paper .chip.st-done { color: #b7ae9c; border-style: dotted; }
  .paper .bullet::before { content: "◦ "; color: var(--pencil); }

  /* ── 源码窗格 ─────────────────────────────── */
  .srcpane { font-family: var(--mono); font-size: 12.8px; line-height: 2; color: #3d3b35; }
  .srcpane .row { white-space: pre-wrap; word-break: break-all; }
  .tok { border-radius: 4px; padding: 0 3px; }
  .tok-due { color: var(--accent); background: var(--accent-tint); }
  .tok-alert { color: var(--amber); background: rgba(154, 107, 0, .10); }
  .srcpane .mk { color: #b0aca3; }

  /* ── 编辑弹层（模拟 popover + DateInput/TimeInput）── */
  .pop { position: absolute; z-index: 50; width: 300px; background: #fff; border-radius: 10px;
         box-shadow: 0 10px 34px rgba(0,0,0,.22), 0 0 0 1px rgba(0,0,0,.06); padding: 13px 14px; display: none; }
  .pop.show { display: block; }
  .pop .fr { display: flex; gap: 8px; margin-bottom: 10px; }
  .pop input { font: inherit; font-size: 13px; padding: 4px 7px; border: 1px solid #d9d6cf; border-radius: 6px;
               flex: 1; min-width: 0; color: var(--ink); background: #fff; }
  .pop input:focus { outline: 2px solid var(--accent-tint); border-color: var(--accent); }
  .pop .cap { font-size: 11.5px; color: var(--sec); margin: 2px 0 6px; }
  .pills { display: flex; flex-wrap: wrap; gap: 5px; }
  .pill { font-size: 12px; padding: 3px 10px; border-radius: 999px; border: 1px solid #d9d6cf; cursor: pointer; background: #fff; color: #55524b; }
  .pill:hover { border-color: var(--accent); color: var(--accent); }
  .pill.sel { background: var(--accent); border-color: var(--accent); color: #fff; }
  .pill:disabled { opacity: .4; pointer-events: none; }
  .pop .ft { display: flex; justify-content: space-between; margin-top: 12px; align-items: center; }
  .pop .ghost { font-size: 12.5px; color: var(--danger); background: none; border: none; cursor: pointer; }
  .pop .ok { font-size: 12.5px; color: #fff; background: var(--accent); border: none; border-radius: 6px; padding: 5px 16px; cursor: pointer; }
  .pop .hint { font-size: 11.5px; color: var(--sec); }

  /* ── macOS 通知模拟 ───────────────────────── */
  .ntf { position: fixed; top: 18px; right: 18px; z-index: 90; width: 340px; display: flex; gap: 11px;
         background: rgba(38, 36, 32, .78); backdrop-filter: blur(18px); color: #fff;
         border-radius: 14px; padding: 13px 14px; box-shadow: 0 12px 34px rgba(0,0,0,.35);
         cursor: pointer; transform: translateY(-120%); transition: transform .45s cubic-bezier(.2,.9,.3,1.1); }
  .ntf.show { transform: none; }
  .ntf .ico { width: 38px; height: 38px; border-radius: 9px; background: #f6efdf; color: #b23a1e;
              display: grid; place-items: center; font-family: "Kaiti SC", serif; font-size: 20px; font-weight: 700; flex: none; }
  .ntf .app { font-size: 11px; opacity: .62; display: flex; justify-content: space-between; }
  .ntf .ttl { font-size: 13px; font-weight: 600; margin-top: 2px; }
  .ntf .bdy { font-size: 13px; opacity: .88; margin-top: 1px; }

  /* ── 底部原型切换条 ───────────────────────── */
  .bar { position: fixed; bottom: 16px; left: 50%; transform: translateX(-50%); z-index: 80;
         display: flex; align-items: center; gap: 10px; background: #211f1b; color: #eee;
         border-radius: 999px; padding: 8px 14px; box-shadow: 0 8px 26px rgba(0,0,0,.3); font-size: 12.5px; }
  .bar .tag { font-size: 10px; letter-spacing: 1px; color: #ffd23f; border: 1px solid #ffd23f;
              border-radius: 4px; padding: 1px 5px; }
  .bar button { background: none; border: none; color: #eee; font-size: 15px; cursor: pointer; padding: 2px 6px; }
  .bar button:hover { color: #ffd23f; }
  .bar .vname { min-width: 130px; text-align: center; }
  .bar .tip { color: #9a968c; font-size: 11.5px; }
</style>
</head>
<body>
  <div class="proto-note">原型 · 只为看效果：同一份数据驱动 <b>预览（标准）</b>、<b>源码</b>、<b>预览（手账）</b> 三视图同步；
    时间令牌可以放在<b>任意内容行的任意位置</b>——任务行是截止（过期标红），普通行只是时刻（过了淡显）；
    点击 <b>chip</b> 或 <b>勾选框</b> 试试联动</div>

  <div class="desk">
    <!-- 预览 · 标准风格 -->
    <div class="win v-a" id="win-preview">
      <div class="topbar">
        <div class="lights"><i></i><i></i><i></i></div>
        <div class="tabs">
          <span class="tdot" style="background:#e0b34d"></span>
          <span class="tdot" style="background:#7fb069"></span>
          <span class="tdot on" style="background:#3b6ea5"></span>
          <span class="tname">待办</span>
        </div>
        <span class="winlabel">预览 · 标准风格</span>
      </div>
      <div class="pane" id="preview"></div>
    </div>

    <!-- 源码模式 -->
    <div class="win" id="win-src">
      <div class="topbar">
        <div class="lights"><i></i><i></i><i></i></div>
        <div class="tabs"><span class="tname" style="background:none;padding-left:0">源码模式 · 同一份数据</span></div>
        <span class="winlabel">⌘⇧P</span>
      </div>
      <div class="pane srcpane" id="src"></div>
    </div>

    <!-- 预览 · 手账风格 -->
    <div class="win paper v-a" id="win-paper">
      <div class="topbar" style="background:#f1e9d6">
        <div class="lights"><i></i><i></i><i></i></div>
        <div class="tabs"><span class="tname" style="background:#e9dfc6">手账风格</span></div>
        <span class="winlabel">预览 · 手账</span>
      </div>
      <div class="pane" id="paperpane"></div>
    </div>
  </div>

  <!-- 编辑弹层 -->
  <div class="pop" id="pop">
    <div class="fr">
      <div style="flex:1.3"><div class="cap">截止日期</div><input type="date" id="p-date"></div>
      <div style="flex:1"><div class="cap">时刻</div><input type="time" id="p-time"></div>
    </div>
    <div class="cap">提醒（提前量，随截止时间联动）</div>
    <div class="pills" id="p-pills"></div>
    <div class="hint" id="p-hint" style="margin-top:8px"></div>
    <div class="ft">
      <button class="ghost" id="p-clear">清除时间</button>
      <button class="ok" id="p-done">完成</button>
    </div>
  </div>

  <!-- 系统通知模拟（应用内调度到点后系统投递的效果） -->
  <div class="ntf" id="ntf">
    <div class="ico">Z</div>
    <div style="flex:1">
      <div class="app"><span>Zakki</span><span id="ntf-when">现在</span></div>
      <div class="ttl">待办提醒 · 待办</div>
      <div class="bdy" id="ntf-body"></div>
    </div>
  </div>

  <!-- 原型切换条 -->
  <div class="bar">
    <span class="tag">PROTOTYPE</span>
    <button id="prev">←</button>
    <span class="vname" id="vname"></span>
    <button id="next">→</button>
    <span class="tip">点击 chip 编辑 · ←/→ 换 chip 风格</span>
    <button id="ntf-btn" title="模拟到点系统通知">🔔</button>
  </div>

<script>
"use strict";
// ── 相对当前时间的示例数据（保证任何日期打开都见过期/今天/未来） ──
const pad = n => String(n).padStart(2, "0");
const at = (off, h, m) => { const d = new Date(); d.setDate(d.getDate() + off); d.setHours(h, m, 0, 0); return d; };
const nextYearMar = () => { const d = new Date(); d.setFullYear(d.getFullYear() + 1, 2, 1); d.setHours(9, 0, 0, 0); return d; };
const WEEK = "日一二三四五六";

let tasks = [
  { id: 1, kind: "task",   text: "回复设计评审意见", due: at(-1, 17, 30), alert: 10, done: false },
  { id: 2, kind: "task",   text: "给多肉浇水",       due: at(0, 20, 0),   alert: null, done: false },
  { id: 3, kind: "task",   text: "交季度 OKR 草稿",   due: at(1, 10, 0),   alert: 60,   done: false },
  { id: 4, kind: "task",   text: "预约牙医",         due: at(3, 9, 30),   alert: null, done: false },
  { id: 5, kind: "task",   text: "年度体检",         due: nextYearMar(),  alert: null, done: false },
  { id: 6, kind: "task",   text: "买牛奶",           due: at(-6, 18, 0),  alert: 0,    done: true },
  { id: 7, kind: "bullet", text: "团建报名",         due: at(3, 18, 0),   alert: 1440, done: false },
  { id: 8, kind: "bullet", text: "随手记：雨伞放公司了", due: null,        alert: null, done: false },
  { id: 9, kind: "plain",  text: "和 Bob 通电话",    due: at(-1, 15, 0),  alert: null, done: false },
];

// ── chip 智能文案（对齐嘀嗒/苹果：今天/明天/周X/日期） ──
function chipState(t) {
  if (t.done) return "st-done";
  if (t.due < new Date()) return t.kind === "task" ? "st-overdue" : "st-done";
  const now = new Date(); const d = t.due;
  const sameDay = d.toDateString() === now.toDateString();
  return sameDay ? "st-today" : "st-future";
}
function chipLabel(t) {
  const d = t.due, hm = pad(d.getHours()) + ":" + pad(d.getMinutes());
  if (t.done) return hm;
  const now = new Date();
  const tmr = new Date(now); tmr.setDate(now.getDate() + 1);
  if (d.getFullYear() !== now.getFullYear())
    return `${d.getFullYear()}年${d.getMonth() + 1}月${d.getDate()}日 ${hm}`;
  if (d.toDateString() === now.toDateString()) return "今天 " + hm;
  if (d.toDateString() === tmr.toDateString()) return "明天 " + hm;
  if ((d - now) / 864e5 < 7) return "周" + WEEK[d.getDay()] + " " + hm;
  return `${d.getMonth() + 1}月${d.getDate()}日 ${hm}`;
}

// ── 源码行渲染：一份状态 → markdown 文本（演示"文本即数据"） ──
const isoDate = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const isoTime = d => `${pad(d.getHours())}:${pad(d.getMinutes())}`;
function alertTok(v) { if (v == null) return null; if (v === 0) return "0m"; if (v < 60) return v + "m"; if (v === 60) return "1h"; return "1d"; }
function sourceLine(t) {
  const mk = t.kind === "task" ? `- [${t.done ? "x" : " "}] ` : t.kind === "bullet" ? "- " : "";
  let s = mk + t.text;
  if (t.due) {
    s += ` <span class="tok tok-due">@${isoDate(t.due)} ${isoTime(t.due)}</span>`;
    const a = alertTok(t.alert);
    if (a) s += ` <span class="tok tok-alert">~${a}</span>`;
  }
  return s;
}

const CAL_SVG = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><rect x="3" y="5" width="18" height="16" rx="2.5"/><path d="M8 3v4M16 3v4M3 10h18"/></svg>`;

function taskRowHTML(t) {
  const has = !!t.due;
  const chip = has ? `<span class="chip ${chipState(t)}" data-id="${t.id}" title="点击编辑时间">${chipLabel(t)}</span>` : "";
  const mark = t.kind === "task"
    ? `<span class="cb${t.done ? " on" : ""}" data-cb="${t.id}"></span>`
    : (t.kind === "bullet" ? `<span class="bm">•</span>` : "");
  return `<div class="task${t.done ? " done" : ""}" data-row="${t.id}">
    ${mark}
    <span class="tx">${t.text}</span>${chip}</div>`;
}

function renderAll() {
  const ctx = `<h3>今天</h3>`;
  const rows = tasks.map(taskRowHTML).join("");
  document.getElementById("preview").innerHTML = ctx + rows;
  document.getElementById("paperpane").innerHTML = ctx + rows;
  document.getElementById("src").innerHTML =
    `<div class="row"># 待办</div>` +
    tasks.map(t => `<div class="row">${sourceLine(t)}</div>`).join("");
  bind();
}

// ── 交互：勾选 / chip 编辑弹层 / 通知模拟 ──
let popTask = null;
function bind() {
  document.querySelectorAll("[data-cb]").forEach(el => el.onclick = e => {
    const t = tasks.find(x => x.id == el.dataset.cb); t.done = !t.done; renderAll();
  });
  document.querySelectorAll(".chip").forEach(el => el.onclick = e => openPop(e, tasks.find(x => x.id == el.dataset.id)));
}
function closePop() { document.getElementById("pop").classList.remove("show"); popTask = null; }
function openPop(e, t) {
  popTask = t;
  const pop = document.getElementById("pop");
  const tiers = [[null, "无提醒"], [0, "准点"], [5, "提前5分"], [10, "提前10分"], [30, "提前30分"], [60, "提前1小时"], [1440, "提前1天"]];
  const pills = document.getElementById("p-pills");
  pills.innerHTML = tiers.map(([v, name]) =>
    `<span class="pill${t.alert === v ? " sel" : ""}" data-v="${v}">${name}</span>`).join("");
  pills.querySelectorAll(".pill").forEach(p => p.onclick = () => {
    t.alert = JSON.parse(p.dataset.v);
    pills.querySelectorAll(".pill").forEach(q => q.classList.toggle("sel", q === p));
  });
  const dateI = document.getElementById("p-date"), timeI = document.getElementById("p-time");
  if (t.due) { dateI.value = isoDate(t.due); timeI.value = isoTime(t.due); } else { dateI.value = ""; timeI.value = ""; }
  if (!t.due) pills.querySelectorAll(".pill").forEach(p => p.setAttribute("disabled", ""));
  else pills.querySelectorAll(".pill").forEach(p => p.removeAttribute("disabled"));
  document.getElementById("p-hint").textContent =
    t.done ? "已完成：到点前的提醒已取消；取消勾选且时刻未过会自动恢复"
    : !t.due ? "先设截止时间，才能安排提醒" : "";
  pop.classList.add("show");
  const r = e.target.closest(".chip").getBoundingClientRect();
  pop.style.left = Math.min(r.left, innerWidth - 320) + "px";
  pop.style.top = Math.min(r.bottom + 8 + scrollY, scrollY + innerHeight - 260) + "px";
  e.stopPropagation();
}
document.getElementById("p-done").onclick = () => {
  if (popTask) {
    const d = document.getElementById("p-date").value, tm = document.getElementById("p-time").value;
    if (d && tm) {
      const [y, m, dd] = d.split("-").map(Number), [hh, mm] = tm.split(":").map(Number);
      popTask.due = new Date(y, m - 1, dd, hh, mm);
    } else popTask.due = null;
    if (!popTask.due) popTask.alert = null;
  }
  closePop(); renderAll();
};
document.getElementById("p-clear").onclick = () => { if (popTask) { popTask.due = null; popTask.alert = null; } closePop(); renderAll(); };
document.addEventListener("click", e => { if (!e.target.closest(".pop") && !e.target.closest(".chip")) closePop(); });

// 通知模拟：应用内调度到点 → 系统投递；点击通知 → 跳转定位到该待办
const ntf = document.getElementById("ntf");
document.getElementById("ntf-btn").onclick = () => {
  const t = tasks[0];
  document.getElementById("ntf-body").textContent = t.text;
  ntf.classList.add("show");
  setTimeout(() => ntf.classList.remove("show"), 6000);
};
ntf.onclick = () => {
  ntf.classList.remove("show");
  const row = document.querySelector(`[data-row="${tasks[0].id}"]`);
  row.scrollIntoView({ behavior: "smooth", block: "center" });
  row.classList.add("flash"); setTimeout(() => row.classList.remove("flash"), 1200);
};

// ── chip 外观变体切换（?variant=A|B|C，←/→ 循环） ──
const VARIANTS = { a: ["v-a", "A · 极简文字"], b: ["v-b", "B · 图标文字"], c: ["v-c", "C · 胶囊浅底"] };
const qv = (new URLSearchParams(location.search).get("variant") || "a").toLowerCase()[0];
let vi = VARIANTS[qv] ? qv : "a";
function applyVariant() {
  ["win-preview", "win-paper"].forEach(id =>
    document.getElementById(id).className = document.getElementById(id).className.replace(/v-[abc]/g, "") + " " + VARIANTS[vi][0]);
  document.getElementById("vname").textContent = "chip 风格 " + VARIANTS[vi][1];
  const u = new URL(location); u.searchParams.set("variant", vi); history.replaceState(null, "", u);
}
document.getElementById("prev").onclick = () => step(-1);
document.getElementById("next").onclick = () => step(1);
function step(d) {
  const keys = Object.keys(VARIANTS);
  vi = keys[(keys.indexOf(vi) + d + keys.length) % keys.length];
  applyVariant();
}
document.addEventListener("keydown", e => {
  if (/INPUT|TEXTAREA/.test(document.activeElement.tagName)) return;
  if (e.key === "ArrowLeft") step(-1);
  if (e.key === "ArrowRight") step(1);
});

renderAll();
applyVariant();
</script>
</body>
</html>
