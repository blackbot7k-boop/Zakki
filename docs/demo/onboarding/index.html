<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>首启初始化向导（三步）· 流程预览</title>
<style>
  /* 原型页：三步向导流程预览，非生产代码。 */
  :root {
    --page-bg: #f5f5f7; --page-text: #1d1d1f; --page-muted: #6e6e73;
  }
  body.dark {
    --page-bg: #161617; --page-text: #f2f2f4; --page-muted: #a8a8ad;
  }
  /* 窗口配色取自应用中性主题 */
  .win {
    --w-bg: #fafaf8; --w-card: #ffffff; --w-line: #dededa;
    --w-text: #2a2c2e; --w-muted: #6b6e72; --w-accent: #3b6ea5;
    --w-surface: #f3f3ef; --w-hover: rgba(0,0,0,.05);
  }
  .win.dark {
    --w-bg: #202224; --w-card: #2b2e31; --w-line: #3d4045;
    --w-text: #e8e9ea; --w-muted: #a3a6aa; --w-accent: #7fb3e3;
    --w-surface: #232528; --w-hover: rgba(255,255,255,.06);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, "PingFang SC", "Helvetica Neue", sans-serif;
    background: var(--page-bg); color: var(--page-text);
    padding: 28px 24px 40px; -webkit-font-smoothing: antialiased;
  }
  header.page { max-width: 920px; margin: 0 auto 18px; display: flex; align-items: baseline; gap: 14px; flex-wrap: wrap; }
  header.page h1 { font-size: 20px; }
  header.page .sub { color: var(--page-muted); font-size: 13px; }
  header.page .spacer { flex: 1; }
  .pagebar { display: flex; gap: 8px; }
  .pagebar button {
    font: 12px -apple-system, "PingFang SC", sans-serif; padding: 5px 12px; border-radius: 7px;
    border: 1px solid var(--page-muted); background: transparent; color: var(--page-text); cursor: pointer;
  }
  .stage { display: flex; gap: 22px; align-items: flex-start; flex-wrap: wrap; max-width: 920px; margin: 0 auto; }
  .win {
    position: relative;
    width: 560px; min-height: 420px; border-radius: 10px; overflow: hidden;
    background: var(--w-bg); color: var(--w-text);
    box-shadow: 0 18px 44px rgba(0,0,0,.18), 0 0 0 1px rgba(0,0,0,.08);
    display: flex; flex-direction: column;
  }
  .win.dark { box-shadow: 0 18px 44px rgba(0,0,0,.5), 0 0 0 1px rgba(255,255,255,.06); }
  .titlebar {
    height: 34px; display: flex; align-items: center; gap: 8px; padding: 0 12px;
    background: color-mix(in srgb, var(--w-bg) 92%, var(--w-text)); border-bottom: 1px solid var(--w-line);
  }
  .titlebar .dots { display: flex; gap: 6px; }
  .titlebar .dots i { width: 11px; height: 11px; border-radius: 999px; display: block; }
  .titlebar .dots i:nth-child(1) { background: #ff5f57; } .titlebar .dots i:nth-child(2) { background: #febc2e; } .titlebar .dots i:nth-child(3) { background: #28c840; }
  .titlebar .t { flex: 1; text-align: center; font-size: 12px; color: var(--w-muted); }
  .body { flex: 1; padding: 22px 30px 12px; display: flex; flex-direction: column; gap: 14px; overflow: auto; }
  .steplabel { font-size: 11px; color: var(--w-muted); }
  h2 { font-size: 21px; }
  h3 { font-size: 17px; }
  .muted { color: var(--w-muted); font-size: 12px; line-height: 1.55; }
  .grow { flex: 1; }
  /* 按钮 */
  .btn {
    font: 13px -apple-system, "PingFang SC", sans-serif; padding: 6px 14px; border-radius: 8px;
    border: 1px solid var(--w-line); background: var(--w-card); color: var(--w-text); cursor: pointer;
  }
  .btn:hover { background: var(--w-hover); }
  .footer { display: flex; gap: 10px; align-items: center; padding: 10px 30px 18px; }
  .footer .spacer { flex: 1; }
  /* 步骤 1 语言 */
  .langrow { display: flex; gap: 10px; }
  .langbtn {
    padding: 14px 26px; border-radius: 10px; cursor: pointer; font-size: 14px;
    border: 1px solid var(--w-line); background: var(--w-card); color: var(--w-text);
  }
  .langbtn.on { border-width: 2px; border-color: var(--w-accent); }
  /* 步骤 2 备份文件夹 */
  .folderbox {
    border: 1px solid var(--w-line); background: var(--w-surface); border-radius: 8px;
    padding: 12px 14px; display: flex; flex-direction: column; gap: 8px;
  }
  .folderbox .cap { font-size: 12px; color: var(--w-muted); }
  .folderbox .path { font: 12px "SF Mono", Menlo, monospace; word-break: break-all; }
  /* 模拟原生目录选择器 */
  .picker {
    position: absolute; inset: 34px 0 0; background: var(--w-bg);
    display: flex; flex-direction: column; padding: 16px 20px; gap: 10px;
  }
  .picker .list { flex: 1; overflow: auto; border: 1px solid var(--w-line); border-radius: 8px; }
  .picker .item {
    display: flex; gap: 10px; align-items: center; padding: 9px 12px; cursor: pointer; font-size: 13px;
  }
  .picker .item:hover { background: var(--w-hover); }
  .picker .item.on { background: var(--w-accent); color: #fff; }
  .picker .item .p { font: 11px "SF Mono", Menlo, monospace; color: inherit; opacity: .7; margin-left: auto; }
  .picker .custom { display: flex; gap: 8px; }
  .picker input[type=text] {
    flex: 1; font: 12px "SF Mono", Menlo, monospace; padding: 6px 9px; border-radius: 7px;
    border: 1px solid var(--w-line); background: var(--w-card); color: var(--w-text);
  }
  /* 步骤 3 标签 */
  .tabrow { display: flex; gap: 14px; align-items: center; }
  .tabrow .n { font-size: 17px; font-weight: 700; min-width: 64px; text-align: center; }
  .tabrow input[type=number] {
    font: 15px -apple-system, "PingFang SC", sans-serif; width: 58px; text-align: center;
    padding: 5px 6px; border-radius: 7px; border: 1px solid var(--w-line);
    background: var(--w-card); color: var(--w-text);
  }
  .dots12 { display: flex; gap: 7px; flex-wrap: wrap; }
  .dots12 i { width: 14px; height: 14px; border-radius: 999px; display: block; }
  /* 状态面板 */
  .state {
    width: 300px; border: 1px dashed var(--page-muted); border-radius: 10px; padding: 12px 14px;
    font: 12px/1.7 "SF Mono", Menlo, monospace; color: var(--page-muted);
  }
  .state b { color: var(--page-text); font-weight: 600; }
  .state .cap { font: 600 12px -apple-system, "PingFang SC", sans-serif; margin-bottom: 6px; color: var(--page-text); }
  .toast {
    position: fixed; left: 50%; bottom: 26px; transform: translateX(-50%);
    background: var(--page-text); color: var(--page-bg); font-size: 13px;
    padding: 9px 16px; border-radius: 9px; opacity: 0; transition: opacity .25s; pointer-events: none;
  }
</style>
</head>
<body>
<header class="page">
  <h1>首启初始化向导（三步）</h1>
  <span class="sub">流程预览：语言 → 备份文件夹（默认路径，可不改）→ 初始标签数量</span>
  <span class="spacer"></span>
  <span class="pagebar">
    <button id="langToggle">English</button>
    <button id="darkToggle">深色</button>
  </span>
</header>

<div class="stage">
  <div class="win" id="win">
    <div class="titlebar">
      <span class="dots"><i></i><i></i><i></i></span>
      <span class="t" id="winTitle"></span>
      <span style="width:40px"></span>
    </div>
    <div class="body">
      <div class="steplabel" id="stepLabel"></div>
      <div id="content" class="grow" style="display:flex;flex-direction:column;gap:12px;"></div>
    </div>
    <div class="footer">
      <button class="btn" id="skipBtn"></button>
      <span class="spacer"></span>
      <button class="btn" id="backBtn"></button>
      <button class="btn" id="nextBtn"></button>
    </div>
  </div>

  <div class="state">
    <div class="cap" id="stateCap"></div>
    <div id="stateDump"></div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
"use strict";
// ---- 文案（对齐 locales/*.json；备份只保留"选本地文件夹"一件事） ----
const T = {
  zh: {
    winTitle: "欢迎使用 Zakki", step: (n,total)=>`初始设置 · 步骤 ${n} / ${total}`,
    skip: "跳过，使用默认设置", back: "上一步", next: "下一步", finish: "完成，进入 Zakki",
    langTitle: "选择语言", langSub: "之后可在设置中随时更改。",
    folderTitle: "备份文件夹",
    folderBody: "每次备份会额外镜像一份到这里。已为你选好默认位置，可以直接下一步；想换地方就点「更换…」。",
    folderCap: "备份将镜像到以下文件夹：", change: "更换…",
    defaultPath: "~/Documents/Zakki 备份",
    pickerTitle: "选择文件夹",
    pickerHint: "模拟 macOS 目录选择器：点常用位置，或输入自定路径",
    customPlaceholder: "或输入自定路径…", customGo: "使用此位置", cancel: "取消",
    tabsTitle: "初始标签数量", tabsBody: (m)=>`决定首次打开时的标签页个数（1–${m} 个）；以后随时可在设置里增删。`, tabsN: (n)=>`${n} 个`,
    finished: "向导结束，进入主窗口（演示）",
    stateCap: "向导草稿状态（实时）",
  },
  en: {
    winTitle: "Welcome to Zakki", step: (n,total)=>`Setup · Step ${n} / ${total}`,
    skip: "Skip, use defaults", back: "Back", next: "Next", finish: "Finish and open Zakki",
    langTitle: "Choose your language", langSub: "You can change it anytime in Settings.",
    folderTitle: "Backup folder",
    folderBody: "Every backup is additionally mirrored to this folder. A default location is preselected — just continue, or click Change to pick another spot.",
    folderCap: "Backups will be mirrored to:", change: "Change…",
    defaultPath: "~/Documents/Zakki Backup",
    pickerTitle: "Choose Folder",
    pickerHint: "Simulated macOS folder picker: click a common location, or type a custom path",
    customPlaceholder: "Or type a custom path…", customGo: "Use this location", cancel: "Cancel",
    tabsTitle: "Number of tabs", tabsBody: (m)=>`How many tabs on first launch (1–${m}); add or remove anytime in Settings.`, tabsN: (n)=>`${n} tabs`,
    finished: "Wizard finished; entering the main window (demo)",
    stateCap: "Wizard draft state (live)",
  },
};
const TAB_COLORS = ["#d4253a","#f67500","#ffd01c","#65c802","#0f75e9","#a40bd8","#98989d","#00a3b4","#f7429c","#a2845e","#5856d6","#32ade6"];
const MAX_TABS = 12;

// ---- 草稿状态：备份文件夹始终有值（默认路径），不存在"未配置"分支 ----
const LAST = 3;
let st = {
  lang: "zh", step: 1, pickerOpen: false,
  dirDraft: null, // null = 尚未显示过第 2 步；进入第 2 步时填默认路径
  tabCount: 7,
};
const t = () => T[st.lang];

// ---- 小工具 ----
const $ = (id) => document.getElementById(id);
const el = (tag, attrs = {}, ...kids) => {
  const n = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (k === "class") n.className = v;
    else if (k.startsWith("on")) n.addEventListener(k.slice(2), v);
    else n.setAttribute(k, v);
  }
  for (const kid of kids) n.append(kid);
  return n;
};
const txt = (label, cls) => el("div", { class: cls }, label);
let toastTimer;
function toast(msg) {
  const n = $("toast"); n.textContent = msg; n.style.opacity = 1;
  clearTimeout(toastTimer); toastTimer = setTimeout(() => (n.style.opacity = 0), 1800);
}

// ---- 各步骤渲染 ----
function renderStep1(box) {
  box.append(txt(t().langTitle, ""), txt(t().langSub, "muted"));
  const row = el("div", { class: "langrow" });
  for (const [tag, label] of [["en", "English"], ["zh", "简体中文"]]) {
    row.append(el("button", {
      class: "langbtn" + (st.lang === tag ? " on" : ""),
      onclick: () => { st.lang = tag; render(); },
    }, label));
  }
  box.append(row);
}

function renderStep2(box) {
  if (st.dirDraft === null) st.dirDraft = t().defaultPath; // 不选就有默认路径
  box.append(txt(t().folderTitle, ""), txt(t().folderBody, "muted"));
  const fb = el("div", { class: "folderbox" },
    el("div", { class: "cap" }, t().folderCap),
    el("div", { class: "path" }, st.dirDraft),
    btn(t().change, () => { st.pickerOpen = true; render(); }),
  );
  box.append(fb);
  // 模拟 macOS 原生目录选择器：常用位置点选即用，或输入自定路径。
  if (!st.pickerOpen) return;
  const places = [
    [st.lang === "zh" ? "文稿" : "Documents", "~/Documents"],
    [st.lang === "zh" ? "桌面" : "Desktop", "~/Desktop"],
    [st.lang === "zh" ? "下载" : "Downloads", "~/Downloads"],
    ["iCloud Drive", "~/Library/Mobile Documents/com~apple~CloudDocs"],
  ];
  const list = el("div", { class: "list" });
  for (const [name, base] of places) {
    const sub = base + "/Zakki " + (st.lang === "zh" ? "备份" : "Backup");
    list.append(el("div", {
      class: "item" + (st.dirDraft === sub ? " on" : ""),
      onclick: () => { st.dirDraft = sub; st.pickerOpen = false; render(); },
    }, el("span", {}, name), el("span", { class: "p" }, sub)));
  }
  const input = el("input", { type: "text", placeholder: t().customPlaceholder });
  box.append(el("div", { class: "picker" },
    txt(t().pickerTitle, ""), txt(t().pickerHint, "muted"),
    list,
    el("div", { class: "custom" }, input,
      btn(t().customGo, () => {
        const v = input.value.trim();
        if (!v) return;
        st.dirDraft = v; st.pickerOpen = false; render();
      }),
      btn(t().cancel, () => { st.pickerOpen = false; render(); }),
    ),
  ));
}

function renderStep3(box) {
  box.append(txt(t().tabsTitle, ""), txt(t().tabsBody(MAX_TABS), "muted"));
  const num = el("input", { type: "number", min: "1", max: String(MAX_TABS), value: String(st.tabCount) });
  num.addEventListener("change", () => {
    let v = parseInt(num.value, 10);
    if (isNaN(v)) v = st.tabCount;
    st.tabCount = Math.min(MAX_TABS, Math.max(1, v));
    render();
  });
  const row = el("div", { class: "tabrow" });
  row.append(btn("−", () => { if (st.tabCount > 1) { st.tabCount--; render(); } }));
  row.append(num);
  row.append(btn("+", () => { if (st.tabCount < MAX_TABS) { st.tabCount++; render(); } }));
  box.append(row);
  const dots = el("div", { class: "dots12" });
  for (let i = 0; i < st.tabCount; i++) dots.append(el("i", { style: `background:${TAB_COLORS[i]}` }));
  box.append(dots);
}

const RENDERERS = { 1: renderStep1, 2: renderStep2, 3: renderStep3 };

// ---- 外壳渲染 ----
function render() {
  $("winTitle").textContent = t().winTitle;
  $("stepLabel").textContent = t().step(st.step, LAST);
  $("skipBtn").textContent = t().skip;
  $("backBtn").textContent = t().back;
  $("nextBtn").textContent = st.step >= LAST ? t().finish : t().next;
  $("skipBtn").style.visibility = st.step >= LAST ? "hidden" : "visible";
  $("backBtn").style.visibility = st.step <= 1 ? "hidden" : "visible";
  $("langToggle").textContent = st.lang === "zh" ? "English" : "中文";
  $("darkToggle").textContent = $("win").classList.contains("dark")
    ? (st.lang === "zh" ? "浅色" : "Light") : (st.lang === "zh" ? "深色" : "Dark");
  $("stateCap").textContent = t().stateCap;
  $("stateDump").innerHTML =
    `step = <b>${st.step}/${LAST}</b><br>` +
    `dirDraft = <b>${st.dirDraft ?? 'null'}</b><br>` +
    `tabCount = <b>${st.tabCount}</b>`;
  const box = $("content");
  box.innerHTML = "";
  RENDERERS[st.step](box);
}

$("skipBtn").addEventListener("click", () => { toast(t().finished); });
$("backBtn").addEventListener("click", () => { if (st.step > 1) { st.step--; render(); } });
$("nextBtn").addEventListener("click", () => {
  if (st.step >= LAST) { toast(t().finished); return; }
  st.step++; render();
});
$("langToggle").addEventListener("click", () => { st.lang = st.lang === "zh" ? "en" : "zh"; render(); });
$("darkToggle").addEventListener("click", () => { $("win").classList.toggle("dark"); render(); });

render();
</script>
</body>
</html>
